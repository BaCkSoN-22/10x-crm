<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>10X CRM — Create account</title><link rel="stylesheet" href="css/styles.css"></head>
<body class="auth-page"><main class="auth-card"><a class="brand auth-brand" href="index.html"><span class="brand-mark">10</span><span>10X CRM</span></a><p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p class="muted">Build better customer relationships, one step at a time.</p>
<form id="signup-form" novalidate>
<label>Full Name<input id="fullName" type="text" autocomplete="name" placeholder="Your full name"><small class="field-error"></small></label>
<label>Email<input id="email" type="text" autocomplete="email" placeholder="you@company.com"><small class="field-error"></small></label>
<label>Company <span class="optional">(optional)</span><input id="company" type="text" placeholder="Company (optional)"><small class="field-error"></small></label>
<label>Password<input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters"><small class="field-error"></small></label>
<label>Confirm Password<input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password"><small class="field-error"></small></label>
<button class="btn btn-primary btn-full" type="submit">Create Account <span>→</span></button></form>
<p class="auth-switch">Already have an account? <a href="index.html">Log in</a></p><div id="toast-root" class="toast-root"></div></main><script type="module" src="js/signup.js"></script></body></html>
