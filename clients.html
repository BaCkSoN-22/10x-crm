<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>10X CRM</title><link rel="stylesheet" href="css/styles.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><span class="brand-mark">10</span><span>10X CRM</span></a><div class="side-label">WORKSPACE</div><nav><a href="dashboard.html" data-nav="dashboard">▦ <span>Dashboard</span></a><a href="clients.html" data-nav="clients">♧ <span>Clients</span></a></nav><div class="sidebar-bottom"><a href="profile.html" data-nav="profile">◎ <span>Profile</span></a><button id="theme-toggle" class="nav-action">◐ <span>Toggle theme</span></button><button id="logout-btn" class="nav-action">↪ <span>Log out</span></button></div></aside><main class="main-content"><header class="mobile-header"><a class="brand" href="dashboard.html"><span class="brand-mark">10</span><span>10X CRM</span></a><button id="mobile-menu" class="icon-btn" aria-label="Toggle menu">☰</button></header><div id="toast-root" class="toast-root"></div>
<section class="page-heading"><div><p class="eyebrow">RELATIONSHIP MANAGEMENT</p><h1>Clients</h1><p class="muted">Keep every conversation and opportunity moving forward.</p></div><button id="add-client-btn" class="btn btn-primary">＋ Add Client</button></section>
<section class="panel clients-panel"><div class="toolbar"><div class="search-wrap"><span>⌕</span><input id="search-input" type="search" placeholder="Search clients or companies..."></div><select id="sort-select" aria-label="Sort clients"><option value="newest">Newest first</option><option value="name">Name A→Z</option><option value="value">Deal value: high → low</option></select></div>
<div class="filter-chips" id="filter-chips"><button class="chip active" data-status="All">All <span id="count-All">0</span></button><button class="chip" data-status="Lead">Lead</button><button class="chip" data-status="Contacted">Contacted</button><button class="chip" data-status="Won">Won</button><button class="chip" data-status="Lost">Lost</button></div>
<div id="clients-list" class="clients-list"><div class="loading-state">Loading clients...</div></div></section>
<div id="client-modal" class="modal hidden"><div class="modal-backdrop" data-close="true"></div><section class="modal-card"><div class="modal-heading"><div><p class="eyebrow">NEW RELATIONSHIP</p><h2>Add client</h2></div><button class="icon-btn" data-close="true">×</button></div><form id="client-form" novalidate>
<div class="form-grid"><label>Name<input id="client-name" type="text" placeholder="Client name"><small class="field-error"></small></label><label>Email<input id="client-email" type="text" placeholder="name@company.com"><small class="field-error"></small></label><label>Phone <span class="optional">(optional)</span><input id="client-phone" type="text" placeholder="+1 555 000 0000"><small class="field-error"></small></label><label>Company <span class="optional">(optional)</span><input id="client-company" type="text" placeholder="Company name"><small class="field-error"></small></label><label>Deal value ($)<input id="client-value" type="number" min="1" placeholder="5000"><small class="field-error"></small></label><label>Status<select id="client-status"><option>Lead</option><option>Contacted</option><option>Won</option><option>Lost</option></select><small class="field-error"></small></label></div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-close="true">Cancel</button><button type="submit" class="btn btn-primary">Save client</button></div></form></section></div>
<div id="details-modal" class="modal hidden"><div class="modal-backdrop" data-detail-close="true"></div><section class="modal-card detail-modal-card"><div class="modal-heading"><div><p class="eyebrow">CLIENT PROFILE</p><h2 id="detail-name">Client details</h2></div><button class="icon-btn" data-detail-close="true">×</button></div><div id="detail-content"></div></section></div>
</main></div><script type="module" src="js/clients.js"></script></body></html>
